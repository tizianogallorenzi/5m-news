# Reemplaza las funciones programadas de Netlify (Render free no incluye cron jobs).
# Llama a los endpoints /api/cron/* del servicio en Render; eso además lo despierta si estaba dormido.
# La URL del servicio está en env.RENDER_URL (o en la variable del repo RENDER_URL si se define).
# CRON_SECRET es opcional: sólo si se configuró también en Render.
name: Tareas programadas 5M News

on:
  schedule:
    - cron: "0 * * * *"     # cada hora: actualización del briefing
    - cron: "50 9 * * 1-5"  # 06:50 ART lunes a viernes: despierta el servicio antes del envío
    - cron: "0 10 * * 1-5"  # 07:00 ART lunes a viernes: email + notificación del briefing
    - cron: "30 10 * * 4"   # 07:30 ART jueves: Resumen de los Jueves
  workflow_dispatch:
    inputs:
      tarea:
        description: "hourly | daily | weekly"
        required: true
        default: hourly

env:
  RENDER_URL: ${{ vars.RENDER_URL || 'https://fivem-news.onrender.com' }}

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Elegir tarea
        id: t
        run: |
          case "${{ github.event.schedule }}" in
            "0 * * * *")    echo "tarea=hourly" >> "$GITHUB_OUTPUT" ;;
            "50 9 * * 1-5") echo "tarea=despertar" >> "$GITHUB_OUTPUT" ;;
            "0 10 * * 1-5") echo "tarea=daily" >> "$GITHUB_OUTPUT" ;;
            "30 10 * * 4")  echo "tarea=weekly" >> "$GITHUB_OUTPUT" ;;
            *)              echo "tarea=${{ github.event.inputs.tarea }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Despertar el servicio (Render free duerme tras 15 min sin uso)
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 60 "$RENDER_URL/healthz" && exit 0
            sleep 15
          done
          exit 1
      - name: Disparar tarea
        if: steps.t.outputs.tarea != 'despertar'
        run: |
          curl -fsS --max-time 60 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "$RENDER_URL/api/cron/${{ steps.t.outputs.tarea }}"
