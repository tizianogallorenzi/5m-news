[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # web-push es CommonJS (usa require de módulos de Node): se incluye tal cual en lugar de empaquetarlo
  external_node_modules = ["web-push"]

# Encabezados de seguridad (sólo aplican al contenido estático)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/briefing.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# App instalable: el service worker y el manifiesto siempre se revalidan (si no, las mejoras tardan en llegar)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
